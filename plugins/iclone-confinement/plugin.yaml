name: iclone-confinement
version: "0.1.0"
description: "icloneOS confinement (V3-G): routes Hermes' terminal through the app's confinement layer — Seatbelt profiles generated by the icloneOS app (deny by default, the project and a scratch dir, the network only when the permission mode or a grant allows it, never the keychain or home secrets), and the Apple container backend once the owner installs it. Inert unless icloneOS started Hermes with ICLONE_CONFINEMENT=1."
author: "CLONE FRAME (icloneOS)"
# Bundled backends auto-load; the plugin stays inert outside icloneOS, so plain Hermes is unaffected.
kind: backend
hooks:
  - pre_tool_call
