name: Bug report
description: Something in iclone os does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Security problems go to [private reporting](https://github.com/devclone20/icloneos/security/advisories/new), not here.
        Before you paste logs or screenshots, remove API keys, tokens, wallet seeds, e-mail addresses and anything else private.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings › Machine › About.
      placeholder: "0.0.4"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 15.4, MacBook Air M2"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - DMG download
        - Zip archive
        - In-app update
        - Built from source
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - First launch / install
        - Message (chat)
        - iT terminal
        - iNFT stage / iNFT Book
        - ACP Market
        - EconomyOS / Wallet / Bank Card / E-mail / Hyperliquid
        - Permissions / Privacy / Containers
        - Payments
        - Settings
        - Updates
        - Something else
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The relevant lines from `~/.hermes/logs/desktop.log`, with anything private removed.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I am on the latest release.
          required: true
        - label: I removed keys, tokens, seeds and personal data from what I pasted.
          required: true
